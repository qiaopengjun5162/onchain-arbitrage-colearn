[package]
name = "solana-rs"
version = "0.1.0"
edition = "2021"
description = "Solana 套利研究脚本（Rust 版）— Jupiter quote/build 客户端"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
base64 = "0.22"
bincode = "1.3"
solana-sdk = "2"
